services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: txt2voice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: txt2voice
      POSTGRES_PASSWORD: txt2voice_password
      POSTGRES_DB: txt2voice
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txt2voice -d txt2voice"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - txt2voice-network

  # PostgreSQL 管理工具 (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: txt2voice-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dan.cancer@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-txt2voice_admin}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - txt2voice-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: txt2voice-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - txt2voice-network

  # RedisInsight - Redis 可视化管理工具
  redisinsight:
    image: redis/redisinsight:latest
    container_name: txt2voice-redisinsight
    restart: unless-stopped
    ports:
      - "18002:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - txt2voice-network
    depends_on:
      redis:
        condition: service_healthy

  # 开发模式的Web应用（支持热更新）
  web:
    # 使用开发专用的 Dockerfile
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: txt2voice-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Database (容器内部连接)
      DATABASE_URL: postgresql://txt2voice:txt2voice_password@postgres:5432/txt2voice
      
      # Redis (容器内部连接)
      REDIS_URL: redis://redis:6379
      
      # Next.js (从 .env 读取，提供默认值)
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-secret-key-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      
      # TTS Providers (从 .env 读取)
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      
      # File Storage
      UPLOAD_DIR: /app/apps/web/uploads
      AUDIO_DIR: /app/apps/web/uploads
      
      # Application Settings
      NODE_ENV: development
      PORT: 3001
      
      # LLM Provider Configuration (从 .env 读取)
      LLM_PROVIDER: ${LLM_PROVIDER:-custom}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      
      # IndexTTS Service (从 .env 文件读取，指向外部 IndexTTS 服务)
      INDEXTTS_API_URL: ${INDEXTTS_API_URL:-http://192.168.88.9:8001}
      COSYVOICE_API_URL: ${COSYVOICE_API_URL:-http://192.168.88.9:8011}
      COSYVOICE_DEFAULT_MODE: ${COSYVOICE_DEFAULT_MODE:-cross_lingual}
      VOXCPM_API_URL: ${VOXCPM_API_URL:-http://192.168.88.9:8012}

      # 开发模式特定配置
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: sh -lc "pnpm prisma generate && pnpm next dev --webpack --hostname 0.0.0.0 -p 3001"
    volumes:
      # 挂整个仓库，减少漏挂配置文件带来的特殊情况
      - .:/app:cached
      # 保留容器内依赖和构建产物，避免被宿主目录覆盖
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/apps/web/src/generated/prisma
      # 上传目录
      - uploads_data:/app/apps/web/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - txt2voice-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  txt2voice-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local
  redisinsight_data:
    driver: local
  uploads_data:
    driver: local
